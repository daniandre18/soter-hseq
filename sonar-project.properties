# Ajusta projectKey/organization con los valores exactos que SonarCloud
# asigne al crear el proyecto (Sonar > "Analyze new project" > importar
# desde GitHub). Estos son el valor por defecto que suele sugerir para
# github.com/daniandre18/soter-hseq — verifícalos antes del primer análisis.
sonar.projectKey=daniandre18_soter-hseq
sonar.organization=daniandre18

sonar.sources=src
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/node_modules/**,**/.next/**,**/out/**

sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info
